<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e27">
<title>المدرب الأفضل - v26</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- ... (باقي كود الـ HTML الخاص بك كما هو بدون تغيير) ... -->

<div id="app">
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px;">
    <div class="app-logo">⚽ المدرب الأفضل <span style="font-size:9px;opacity:.6">v26</span></div>
    
    <!-- الملف الشخصي للمدرب (VIP) -->
    <div class="user-profile-header" onclick="switchTab('mgr')" style="display:flex; align-items:center; gap:8px; cursor:pointer; background:linear-gradient(135deg, rgba(30,58,138,.8), rgba(15,34,56,.9)); padding:4px 12px; border-radius:20px; border:1px solid var(--gold); box-shadow: 0 4px 10px rgba(0,0,0,.3); transition: transform 0.2s;">
      <div style="width:32px; height:32px; border-radius:50%; background:var(--gold); display:flex; align-items:center; justify-content:center; font-size:18px; border: 2px solid #fff; box-shadow: 0 0 10px rgba(251,191,36,.6);">👨‍💼</div>
      <div style="display:flex; flex-direction:column; align-items:flex-start;">
        <div id="hdr-name" style="font-size:12px; font-weight:900; color:#fff; line-height:1; max-width:100px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">المدرب</div>
        <div style="font-size:9px; line-height:1; margin-top:3px; display:flex; gap:6px; align-items:center;">
          <span id="hdr-vip" style="color:#22d3ee; font-weight:900; background:rgba(34,211,238,.15); padding:1px 4px; border-radius:4px;">💎 VIP 0</span>
          <span id="hdr-trophies" style="color:var(--gold); font-weight:bold;">🏆 0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- شريط اليوم والميزانية -->
  <div id="game-info-bar" style="display: flex; justify-content: space-between; padding: 6px 16px; background: rgba(10,14,39,.95); border-bottom: 1px solid rgba(251,191,36,.2); font-size: 11px; color: #fff; z-index: 9;">
    <div>📅 اليوم: <b id="hdr-day" style="color:var(--gold)">1</b></div>
    <div>💰 الميزانية: <b id="hdr-budget" style="color:#4ade80">0.0M</b></div>
  </div>

  <main id="main"></main>
  
  <nav class="bottom-nav" id="bottom-nav" hidden>
    <div class="nav-item" onclick="switchTab('lu')"><span>📋</span>التشكيلة</div>
    <div class="nav-item" onclick="switchTab('tb')"><span>📊</span>الترتيب</div>
    <div class="nav-item" onclick="switchTab('comp')"><span>🏆</span>البطولات</div>
    <div class="nav-item" onclick="switchTab('tr')"><span>🛒</span>السوق</div>
    <div class="nav-item" onclick="switchTab('cr')"><span>🎴</span>الفريق</div>
    <div class="nav-item" onclick="switchTab('mgr')"><span>👑</span>الملف</div>
    <div class="nav-item" onclick="switchTab('news')"><span>📰</span>الأخبار</div>
  </nav>
</div>

<!-- ... (باقي النوافذ المنبثقة modals كما هي) ... -->
<div id="ms" class="ov" hidden>...</div>
<div id="sm" class="md" hidden>...</div>
<div id="pm" class="md" hidden>...</div>
<div id="rs" class="md" hidden>...</div>
<div id="cm" class="md" hidden>...</div>
<div id="om" class="md" hidden>...</div>
<div id="pen-m" class="md" hidden>...</div>
<div id="game-over" class="md" hidden>...</div>

<!-- السكربتات الخاصة بك -->
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="cmt.js"></script>
<script src="js/engine.js"></script>
<script src="js/season.js"></script>
<script src="js/news.js"></script>
<script src="js/ui.js"></script>
<script src="js/match.js"></script>
<script src="js/main.js"></script>

<!-- ⚠️ إضافات Supabase (الخطوة 1 و 2 من الصورة) ⚠️ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>

</body>
</html>
